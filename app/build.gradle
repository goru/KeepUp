plugins {
    alias(libs.plugins.android.application)
}

// Build time in JST (e.g. 26100301), used as the version for local builds
def buildTime = java.time.ZonedDateTime.now(java.time.ZoneId.of('Asia/Tokyo'))
        .format(java.time.format.DateTimeFormatter.ofPattern('yyMMddHH'))

android {
    namespace 'org.gorugle.keepup'
    compileSdk 30

    defaultConfig {
        applicationId "org.gorugle.keepup"
        minSdk 30
        targetSdk 30
        // Release builds on CI pass these from the tag (vX.Y.Z+yyMMddHH)
        versionCode = (project.findProperty('appVersionCode') ?: buildTime).toInteger()
        versionName = project.findProperty('appVersionName') ?: "0.0.0-dev+${buildTime}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
}
